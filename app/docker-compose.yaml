services:
  web:
    build: .
    ports:
      - "8000:8000"
    restart: always
    environment:
      - MONGO_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
